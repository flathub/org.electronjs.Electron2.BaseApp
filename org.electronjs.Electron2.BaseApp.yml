id: org.electronjs.Electron2.BaseApp
branch: '25.08'
runtime: org.freedesktop.Platform
sdk: org.freedesktop.Sdk
runtime-version: '25.08'
separate-locales: false
sdk-extensions:
  - org.freedesktop.Sdk.Extension.vala
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/aclocal
  - /share/devhelp
  - /share/gir-1.0
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/vala
  - /lib/systemd
  - '*.la'
  - '*.a'
modules:
  - shared-modules/dbus-glib/dbus-glib.json
  - shared-modules/libappindicator/libappindicator-gtk3-12.10.json

  - name: libsecret
    buildsystem: meson
    config-opts:
      - -Dmanpage=false
      - -Dcrypto=disabled
      - -Dvapi=false
      - -Dgtk_doc=false
      - -Dintrospection=false
      - -Dbash_completion=disabled
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/man
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libsecret/0.21/libsecret-0.21.4.tar.xz
        sha256: 163d08d783be6d4ab9a979ceb5a4fecbc1d9660d3c34168c581301cd53912b20
        x-checker-data:
          type: gnome
          name: libsecret

  - libunity.yml

  - name: gvfs-trash
    buildsystem: simple
    build-commands:
      - install -m755 gvfs-trash /app/bin/gvfs-trash
    sources:
      - type: script
        dest-filename: gvfs-trash
        commands:
          - exec rm -r "$@"

  - name: libgnome-keyring
    config-opts:
      - --disable-static
      - --disable-gtk-doc
      - --disable-coverage
      - --disable-introspection
    rm-configure: true
    build-options:
      env:
        GTKDOCIZE: 'true'
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libgnome-keyring/3.12/libgnome-keyring-3.12.0.tar.xz
        sha256: c4c178fbb05f72acc484d22ddb0568f7532c409b0a13e06513ff54b91e947783
      - type: script
        commands: [autoreconf -vfi]
        dest-filename: autogen.sh

  - name: python3-asarPy
    buildsystem: simple
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "asarPy" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/d7/ab/6c971fb30ffd7f892eada14f28b439f5621fb291bd333e3d67af1e208e49/asarPy-1.0.1.tar.gz
        sha256: 1f1a9a230942da620bc134eccda7be352f731301ac1269e71e426419e433a0d6
        x-checker-data:
          type: pypi
          name: asarPy

  - name: patch-desktop-filename
    buildsystem: simple
    build-commands:
      - install -Dm755 patch-desktop-filename.py ${FLATPAK_DEST}/bin/patch-desktop-filename
    sources:
      - type: file
        path: patch-desktop-filename.py

  - name: zypak
    sources:
      - type: git
        url: https://github.com/refi64/zypak
        tag: v2025.09
        commit: 693a71c5ffa80ec9c9ce2ae03b1ccc493c698e53
        x-checker-data:
          type: git
          tag-pattern: ^v([\d.]+)$

  # Chromium dynamically loads the Speech Dispatcher library libspeechd.so.2.
  # If present, and --enable-speech-dispatcher flag is passed, Web Speech API will be enabled.
  # This section is borrowed and tweaked from:
  # https://github.com/flathub/net.lutris.Lutris/blob/76e94a0b80ef3ebc1b9a6b61f47d736f5ddd772c/net.lutris.Lutris.yml#L495
  # https://gitlab.archlinux.org/archlinux/packaging/packages/speech-dispatcher/-/blob/414baaf78b5fe416df88a89ac18d2dd579a0c653/PKGBUILD
  - name: libspeechd
    config-opts:
      - --disable-static
      - --with-ibmtts=no
      - --with-kali=no
      - --with-baratinoo=no
      - --with-voxin=no
      - --without-flite
      - --disable-python
    no-make-install: true
    post-install:
      - cd ./src/api/c && make install
    cleanup:
      - '*.la'
      - '*.a'
      - /include
    sources:
      - type: archive
        url: https://github.com/brailcom/speechd/releases/download/0.12.1/speech-dispatcher-0.12.1.tar.gz
        sha256: b14a5238d287d2dcce4dd42bbd66ca65fa228e7e683708267f7b34036f7ba4b4
    modules:
      # dotconf provides utility functions to parse config files. It's only linked with the speech-dispatcher server,
      # which we aren't building, but it needs to exist to get past the ./configure step anyway
      - name: dotconf
        sources:
          - type: archive
            url: https://github.com/williamh/dotconf/archive/refs/tags/v1.4.1.tar.gz
            sha512: a6cada8621295b268d4b4fd85bc0c207e78324c9e84754ead2fdf6c1598ec8bdf626f9c24e66063d921c95d73e83b50ab50416a9b4c9a7a631392552ec46f55a
          - type: script
            commands:
              - autoreconf -fiv
            dest-filename: autogen.sh
        cleanup:
          - '*'
